<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>DEMO PROJECT - UstaMarketplace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">UstaMarketplace</a>
            <div class="collapse navbar-collapse">
                <div class="navbar-nav ms-auto" id="nav-auth-links"></div>
            </div>
        </div>
    </nav>

    <div class="bg-primary text-white py-5 mb-4">
        <div class="container">
            <h1 class="fw-bold text-center mb-4">Professional Usta va Xizmatlarni Toping</h1>
            
            <div class="card p-4 shadow-sm text-dark border-0">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Qidiruv</label>
                        <input type="text" id="search-input" class="form-control" placeholder="Xizmat nomi, tavsifi yoki kategoriya...">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-bold">Kategoriya</label>
                        <select id="category-filter" class="form-select">
                            <option value="">Barcha kategoriyalar</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label fw-bold">Min narx</label>
                        <input type="number" id="min-price" class="form-control" placeholder="0">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label fw-bold">Max narx</label>
                        <input type="number" id="max-price" class="form-control" placeholder="9999999">
                    </div>
                    <div class="col-md-1 d-flex align-items-end">
                        <button class="btn btn-warning w-100 fw-bold" onclick="applyFilters()">Filter</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="container mb-5">
        <h3 class="mb-4 fw-bold">Mavjud xizmatlar</h3>
        <div class="row" id="services-container"></div>

        <nav class="mt-4">
            <ul class="pagination justify-content-center" id="pagination-container"></ul>
        </nav>
    </div>

    <div class="modal fade" id="detailModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title fw-bold" id="detail-title">Xizmat nomi</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="text-success fw-bold mb-0" id="detail-price">0 so'm</h5>
                        <div id="detail-avg-rating"></div> 
                    </div>
                    
                    <label class="fw-bold text-dark mb-1">Xizmat haqida to'liq tavsif:</label>
                    <div class="p-3 bg-light rounded text-secondary mb-4" id="detail-desc" style="white-space: pre-line;"></div>
                    
                    <label class="fw-bold text-dark mb-2">💬 Mijozlar tomonidan qoldirilgan barcha sharhlar:</label>
                    <div id="detail-reviews-list" class="row g-2"></div>
                </div>
                <div class="modal-footer" id="detail-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Yopish</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="workerProfileModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title fw-bold">Usta Profili</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center" id="worker-profile-content"></div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="myProfileModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title fw-bold">Profil sozlamalari</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="profile-edit-form">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Username</label>
                            <input type="text" id="edit-username" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Telefon raqam</label>
                            <input type="text" id="edit-phone" class="form-control" required>
                        </div>
                        
                        <div id="worker-extra-fields" class="d-none">
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Tajriba (Yil)</label>
                                <input type="number" id="edit-experience" class="form-control">
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Manzil</label>
                                <input type="text" id="edit-location" class="form-control">
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Men haqimda (Bio)</label>
                                <textarea id="edit-bio" class="form-control" rows="3"></textarea>
                            </div>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100 mt-2">O'zgarishlarni saqlash</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="config/endpoints.js"></script>
    <script>
        let userRole = localStorage.getItem("user_role") || null;
        let currentUrl = API.services; 

        function getUserIdFromToken() {
            let id = localStorage.getItem("user_id");
            if (id) return id;
            
            const token = localStorage.getItem("access");
            if (!token) return null;
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const payload = JSON.parse(window.atob(base64));
                if (payload.user_id) {
                    localStorage.setItem("user_id", payload.user_id);
                    return payload.user_id;
                }
                if (payload.id) {
                    localStorage.setItem("user_id", payload.id);
                    return payload.id;
                }
            } catch (e) {
                console.error("Tokenni decode qilishda xatolik:", e);
            }
            return null;
        }

        document.addEventListener("DOMContentLoaded", async () => {
            renderNavbar();
            
            const token = localStorage.getItem("access");
            const currentUserId = getUserIdFromToken();
            
            if (token && currentUserId) {
                try {
                    await checkUserRole();
                } catch (e) {
                    console.log("Rol tekshirishda xato, mehmon rejimida davom etiladi.");
                }
            } else {
                userRole = null;
                localStorage.removeItem("user_role");
            }
            
            await loadCategories();
            await fetchServices(currentUrl); 
        });

        function renderNavbar() {
            const nav = document.getElementById("nav-auth-links");
            const token = localStorage.getItem("access");
            if (token) {
                // Rolga qarab dashboard yoki admin panel manzilini aniqlaymiz
                let dashboardLink = "dashboard.html";
                let btnText = "Kabinet (Dashboard)";
                let btnClass = "btn-outline-light";

                if (userRole === "admin" || userRole === "superuser") {
                    dashboardLink = "admin.html"; // Admin sahifangiz nomi (agar u boshqacha bo'lsa o'zgartiring)
                    btnText = "⚙️ Admin Panel";
                    btnClass = "btn-warning text-dark";
                }

                nav.innerHTML = `
                    <div class="nav-item d-inline-block"><button class="btn btn-sm btn-outline-info me-2 text-white" onclick="openMyProfileModal()">👤 Profilim</button></div>
                    <div class="nav-item d-inline-block"><a class="nav-link btn btn-sm ${btnClass} me-2 d-inline-block" href="${dashboardLink}">${btnText}</a></div>
                    <div class="nav-item d-inline-block"><button class="btn btn-sm btn-danger ms-2" onclick="logout()">Chiqish</button></div>
                `;
            } else {
                nav.innerHTML = `
                    <div class="nav-item d-inline-block"><a class="nav-link text-white d-inline-block" href="login.html">Kirish</a></div>
                    <div class="nav-item d-inline-block"><a class="btn btn-warning btn-sm ms-2 fw-bold text-dark" href="register.html">Ro'yxatdan o'tish</a></div>
                `;
            }
        }

        async function checkUserRole() {
            const currentUserId = getUserIdFromToken();
            if (!currentUserId) return;
            
            const res = await fetchWithAuth(`${API.users}${currentUserId}/`);
            if (res.ok) {
                const profile = await res.json();
                userRole = profile.role || (profile.is_superuser ? "admin" : "client");
                localStorage.setItem("user_role", userRole);
                
                // Agar kirgan odam admin bo'lsa va uni adashib usta/mijoz sahifalariga burib yuborayotgan bo'lsak,
                // index.html uning navigatsiyasini darhol qayta chizadi.
                renderNavbar();
            }
        }

        async function loadCategories() {
            try {
                const res = await fetch(API.categories);
                const data = await res.json();
                const select = document.getElementById("category-filter");
                const list = data.results || data || [];
                select.innerHTML = '<option value="">Barcha kategoriyalar</option>';
                list.forEach(c => { select.innerHTML += `<option value="${c.id}">${c.name}</option>`; });
            } catch (err) { 
                console.error("Kategoriyalar yuklanmadi:", err); 
            }
        }

        async function fetchServices(url) {
            try {
                const container = document.getElementById("services-container");
                container.innerHTML = "<div class='text-center text-muted py-5'>Xizmatlar yuklanmoqda...</div>";

                const res = await fetch(url);
                if (!res.ok) throw new Error("Backend javob bermadi");
                
                const data = await res.json();
                const services = data.results || data || []; 
                
                displayServices(services);
                renderPagination(data.previous, data.next, url);

            } catch (err) {
                console.error("FetchServices xatosi:", err);
                document.getElementById("services-container").innerHTML = `
                    <div class="col-12 text-center text-danger py-5">
                        <h5>Xizmatlarni yuklab bo'lmadi.</h5>
                        <p class="small text-muted">Server ishlayotganini va tarmoqni tekshiring.</p>
                        <button class="btn btn-sm btn-outline-primary mt-2" onclick="fetchServices(currentUrl)">Qayta urinish</button>
                    </div>`;
            }
        }

        function displayServices(services) {
            const container = document.getElementById("services-container");
            container.innerHTML = services.length ? "" : "<p class='text-center text-muted py-5'>Siz qidirgan filtr bo'yicha hech qanday xizmat topilmadi.</p>";
            
            services.forEach(s => {
                let actionButton = "";
                if (userRole === "worker") {
                    actionButton = `<button class="btn btn-sm btn-secondary" disabled>Ustalarga taqiqlangan</button>`;
                } else if (userRole === "admin" || userRole === "superuser") {
                    actionButton = `<button class="btn btn-sm btn-dark" disabled>Admin Rejimi</button>`;
                } else {
                    actionButton = `<button class="btn btn-sm btn-primary fw-bold" onclick="bookOrder(${s.id})">Buyurtma berish</button>`;
                }

                const avgRating = parseFloat(s.average_rating) || 0;
                const reviewsCount = parseInt(s.reviews_count) || 0;
                let ratingHTML = "";

                if (reviewsCount > 0) {
                    let stars = "★".repeat(Math.round(avgRating)) + "☆".repeat(5 - Math.round(avgRating));
                    ratingHTML = `
                        <div class="mb-2 small d-flex align-items-center">
                            <span class="text-warning me-1">${stars}</span>
                            <span class="text-muted fw-bold">${avgRating.toFixed(1)} (${reviewsCount} ta fikr)</span>
                        </div>`;
                } else {
                    ratingHTML = `<div class="mb-2 small text-muted">☆☆☆☆☆ (Sharhlar yo'q)</div>`;
                }

                const fullDesc = s.description || 'Tavsif berilmagan';
                const shortDesc = fullDesc.length > 120 ? fullDesc.substring(0, 120) + '...' : fullDesc;
                const safeDesc = fullDesc.replace(/`/g, '\\`').replace(/\$/g, '\\$').replace(/"/g, '&quot;');

                const workerName = s.worker_name || "Usta";
                // Backenddan kelayotgan telefon raqamni tekshiramiz
                const workerPhone = s.worker_phone || "Raqam ko'rsatilmagan"; 
                const workerProfileId = s.worker || 0;

                container.innerHTML += `
                    <div class="col-md-4 mb-4">
                        <div class="card h-100 shadow-sm border-0 d-flex flex-column justify-content-between">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-start mb-1">
                                    <h5 class="card-title fw-bold text-primary mb-0">${s.name}</h5>
                                    <a href="javascript:void(0)" onclick="viewWorkerProfile(${workerProfileId})" class="text-primary fw-bold text-decoration-none small">
                                        👤 ${workerName}
                                    </a>
                                </div>
                                
                                ${ratingHTML}
                                
                                <p class="text-secondary small mb-3">${shortDesc}</p>

                                <div class="mb-2 p-2 bg-light border rounded text-secondary small fw-bold">
                                    📞 Aloqa raqami: <span class="text-dark">${workerPhone}</span>
                                </div>

                                <button class="btn btn-link p-0 text-decoration-none small fw-bold mt-1 d-block text-start" 
                                    onclick="openDetailModal('${s.name}', \`${safeDesc}\`, ${s.price}, ${s.id}, '[]')">
                                    Batafsil ko'rish →
                                </button>
                            </div>
                            <div class="card-footer bg-transparent border-0 d-flex justify-content-between align-items-center pt-0 pb-3 px-3">
                                <span class="badge bg-success fs-6">${parseFloat(s.price).toLocaleString()} so'm</span>
                                ${actionButton}
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        async function openDetailModal(name, desc, price, id, reviewsJson) {
            document.getElementById("detail-title").innerText = name;
            document.getElementById("detail-desc").innerText = desc;
            document.getElementById("detail-price").innerText = parseFloat(price).toLocaleString() + " so'm";

            const reviewsListContainer = document.getElementById("detail-reviews-list");
            const avgRatingContainer = document.getElementById("detail-avg-rating");
            
            reviewsListContainer.innerHTML = "<div class='text-center text-muted small w-100 py-2'>Sharhlar yuklanmoqda...</div>";
            avgRatingContainer.innerHTML = "";

            let reviews = [];
            try {
                const res = await fetch(`${API.reviews}?service=${id}`); 
                if (res.ok) {
                    const data = await res.json();
                    reviews = data.results || data || [];
                }
            } catch (err) {
                console.error("Sharhlarni API'dan olishda xatolik:", err);
            }

            reviewsListContainer.innerHTML = "";

            if (reviews && reviews.length > 0) {
                const total = reviews.reduce((sum, r) => sum + (parseFloat(r.rating) || 0), 0);
                const avg = (total / reviews.length).toFixed(1);
                let modalStars = "★".repeat(Math.round(avg)) + "☆".repeat(5 - Math.round(avg));
                
                avgRatingContainer.innerHTML = `<span class="badge bg-warning text-dark fw-bold fs-6">${modalStars} ${avg}</span>`;

                reviews.forEach(r => {
                    const ratingValue = parseInt(r.rating) || 0;
                    let rStars = "★".repeat(ratingValue) + "☆".repeat(5 - ratingValue);
                    const clientName = r.client_name || "Mijoz"; 
                    const commentText = r.comment || 'Fikr qoldirilmagan.';

                    reviewsListContainer.innerHTML += `
                        <div class="col-md-6">
                            <div class="p-3 bg-white rounded border shadow-sm h-100">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <span class="fw-bold text-dark small">👤 ${clientName}</span>
                                    <span class="text-warning small">${rStars}</span>
                                </div>
                                <p class="text-muted small mb-0" style="font-style: italic;">"${commentText}"</p>
                            </div>
                        </div>
                    `;
                });
            } else {
                avgRatingContainer.innerHTML = `<span class="badge bg-light text-muted">☆☆☆☆☆ 0.0</span>`;
                reviewsListContainer.innerHTML = `<p class="text-muted small ps-2 w-100 text-center py-2">Ushbu xizmatga hali hech kim fikr bildirmagan.</p>`;
            }

            const footer = document.getElementById("detail-footer");
            footer.innerHTML = `<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Yopish</button>`;

            if (userRole === "worker") {
                footer.innerHTML += `<button class="btn btn-secondary" disabled>Ustalarga taqiqlangan</button>`;
            } else if (userRole === "admin" || userRole === "superuser") {
                footer.innerHTML += `<button class="btn btn-dark" disabled>Admin Rejimi</button>`;
            } else {
                footer.innerHTML += `<button class="btn btn-success fw-bold" onclick="bookOrder(${id})">Hozir Buyurtma berish</button>`;
            }

            new bootstrap.Modal(document.getElementById('detailModal')).show();
        }

        // Service kartasida usta nomini bosganda Ommaviy Profilni ko'rish (WorkerPublicViewSet)
        async function viewWorkerProfile(workerUserId) {
            if(!workerUserId || workerUserId === 0) {
                alert("Ushbu ustaning profili tizimda to'liq sozlanmagan.");
                return;
            }
            const content = document.getElementById("worker-profile-content");
            content.innerHTML = `<div class='text-center py-3'><div class='spinner-border text-primary' role='status'></div></div>`;
            
            new bootstrap.Modal(document.getElementById('workerProfileModal')).show();

            try {
                // API.worker_public endpointidan foydalanamiz
                const res = await fetch(`${API.worker_public}${workerUserId}/`); 
                if (res.ok) {
                    const profile = await res.json();
                    
                    // WorkerPublicSerializer maydonlari:
                    const username = profile.username || "usta";
                    const experience = profile.experience_years || 0;
                    const location = profile.location || "Kiritilmagan";
                    const bio = profile.bio || "Biografiya yozilmagan.";
                    const phone = profile.phone_number || "Mavjud emas";

                    content.innerHTML = `
                        <div class="bg-light p-3 rounded-circle d-inline-block mb-2 text-primary fs-3 fw-bold" style="width:60px; height:60px; line-height:30px;">
                            ${username[0].toUpperCase()}
                        </div>
                        <h4 class="fw-bold mb-1">@${username}</h4>
                        <p class="badge bg-success mb-3">Professional Usta</p>
                        
                        <div class="text-start bg-light p-3 rounded mb-3 small">
                            <p class="mb-2"><strong>💼 Tajriba:</strong> ${experience} yil</p>
                            <p class="mb-2"><strong>📍 Manzil:</strong> ${location}</p>
                            <p class="mb-0"><strong>📝 Men haqimda (Bio):</strong> ${bio}</p>
                        </div>
                        <div class="p-2 bg-white border rounded text-secondary small fw-bold mb-2">
                            📞 Aloqa raqami: <span class="text-dark">${phone}</span>
                        </div>
                    `;
                } else {
                    content.innerHTML = `<p class="text-danger py-3">Usta ma'lumotlarini yuklab bo'lmadi.</p>`;
                }
            } catch (err) {
                console.error(err);
                content.innerHTML = `<p class="text-danger py-3">Tizimda xatolik yuz berdi.</p>`;
            }
        }

        // Usta o'z profilini tahrirlash uchun modal ochganda (WorkerProfileView)
        async function openMyProfileModal() {
            new bootstrap.Modal(document.getElementById('myProfileModal')).show();

            try {
                // ID shart emas, chunki get_object request.user'dan oladi
                const res = await fetchWithAuth(API.profile); 
                if (res.ok) {
                    const data = await res.json();
                    
                    // WorkerProfileSerializer ichidagi nested 'user' obyekti ma'lumotlari:
                    document.getElementById("edit-username").value = data.user?.username || "";
                    document.getElementById("edit-phone").value = data.user?.phone_number || "";

                    const extraFields = document.getElementById("worker-extra-fields");
                    if (userRole === 'worker') {
                        extraFields.classList.remove('d-none');
                        // Asosiy model maydonlari (bio, experience_years, location)
                        document.getElementById("edit-experience").value = data.experience_years || 0;
                        document.getElementById("edit-location").value = data.location || '';
                        document.getElementById("edit-bio").value = data.bio || '';
                    } else {
                        extraFields.classList.add('d-none');
                    }
                }
            } catch (err) {
                console.error("Mening profilim yuklanmadi:", err);
            }
        }

        // Profilni saqlash (WorkerProfileSerializer - user fields are read_only)
        document.getElementById("profile-edit-form").addEventListener("submit", async (e) => {
            e.preventDefault();

            // Faqat profilga tegishli yoziladigan maydonlarni yuboramiz
            const updatedData = {
                experience_years: parseInt(document.getElementById("edit-experience").value) || 0,
                location: document.getElementById("edit-location").value,
                bio: document.getElementById("edit-bio").value
            };

            try {
                const res = await fetchWithAuth(API.profile, {
                    method: 'PATCH', 
                    body: JSON.stringify(updatedData)
                });

                if (res.ok) {
                    alert("Profil muvaffaqiyatli yangilandi! 🎉");
                    window.location.reload(); 
                } else {
                    const errorData = await res.json();
                    alert("Xatolik yuz berdi: " + JSON.stringify(errorData));
                }
            } catch (err) {
                console.error(err);
                alert("Tizim xatoligi yuz berdi.");
            }
        });

        function applyFilters() {
            const searchQuery = document.getElementById("search-input").value;
            const categoryId = document.getElementById("category-filter").value;
            const minPrice = document.getElementById("min-price").value;
            const maxPrice = document.getElementById("max-price").value;

            const params = new URLSearchParams();
            if (searchQuery) params.append("search", searchQuery);
            if (categoryId) params.append("category", categoryId);
            if (minPrice) params.append("min_price", minPrice);
            if (maxPrice) params.append("max_price", maxPrice);

            currentUrl = `${API.services}?${params.toString()}`;
            fetchServices(currentUrl);
        }

        function renderPagination(prevUrl, nextUrl, current) {
            const paginationContainer = document.getElementById("pagination-container");
            paginationContainer.innerHTML = "";

            if (!prevUrl && !nextUrl) return;

            const prevDisabled = prevUrl ? "" : "disabled";
            paginationContainer.innerHTML += `
                <li class="page-item ${prevDisabled}">
                    <button class="page-link" onclick="fetchServices('${prevUrl}')">« Orqaga</button>
                </li>
            `;

            paginationContainer.innerHTML += `<li class="page-item disabled"><span class="page-link text-dark fw-bold">Sahifa</span></li>`;

            const nextDisabled = nextUrl ? "" : "disabled";
            paginationContainer.innerHTML += `
                <li class="page-item ${nextDisabled}">
                    <button class="page-link" onclick="fetchServices('${nextUrl}')">Oldinga »</button>
                </li>
            `;
        }

        function bookOrder(serviceId) {
            if (!localStorage.getItem("access")) {
                alert("Buyurtma berish uchun avval tizimga kirishingiz kerak!");
                window.location.href = "login.html";
                return;
            }
            localStorage.setItem("selected_service_id", serviceId);
            window.location.href = "order.html";
        }

        function logout() { localStorage.clear(); window.location.reload(); }
    </script>
</body>
</html>
