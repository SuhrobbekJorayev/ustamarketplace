<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEMO PROJECT - UstaMarketplace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">UstaMarketplace</a>
            <div class="collapse navbar-collapse show">
                <div class="navbar-nav ms-auto" id="nav-auth-links"></div>
            </div>
        </div>
    </nav>

    <div class="bg-primary text-white py-5 mb-4">
        <div class="container">
            <h1 class="fw-bold text-center mb-4">Professional Usta va Xizmatlarni Toping</h1>
            
            <div class="card p-4 shadow-sm text-dark border-0">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Qidiruv</label>
                        <input type="text" id="search-input" class="form-control" placeholder="Xizmat nomi, tavsifi yoki kategoriya...">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-bold">Kategoriya</label>
                        <select id="category-filter" class="form-select">
                            <option value="">Barcha kategoriyalar</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label fw-bold">Min narx</label>
                        <input type="number" id="min-price" class="form-control" placeholder="0">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label fw-bold">Max narx</label>
                        <input type="number" id="max-price" class="form-control" placeholder="9999999">
                    </div>
                    <div class="col-md-1 d-flex align-items-end">
                        <button class="btn btn-warning w-100 fw-bold" onclick="applyFilters()">Filter</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="container mb-5">
        <h3 class="mb-4 fw-bold">Mavjud xizmatlar</h3>
        <div class="row" id="services-container"></div>

        <nav class="mt-4">
            <ul class="pagination justify-content-center" id="pagination-container"></ul>
        </nav>
    </div>

    <div class="modal fade" id="detailModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title fw-bold" id="detail-title">Xizmat nomi</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="text-success fw-bold mb-0" id="detail-price">0 so'm</h5>
                        <div id="detail-avg-rating"></div> 
                    </div>
                    <label class="fw-bold text-dark mb-1">Xizmat haqida to'liq tavsif:</label>
                    <div class="p-3 bg-light rounded text-secondary mb-4" id="detail-desc" style="white-space: pre-line;"></div>
                    <label class="fw-bold text-dark mb-2">💬 Mijozlar tomonidan qoldirilgan barcha sharhlar:</label>
                    <div id="detail-reviews-list" class="row g-2"></div>
                </div>
                <div class="modal-footer" id="detail-footer"></div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="workerProfileModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title fw-bold">Usta Profili</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center" id="worker-profile-content"></div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="myProfileModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title fw-bold">Profil sozlamalari</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="profile-edit-form">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Username</label>
                            <input type="text" id="edit-username" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Email manzili</label>
                            <input type="email" id="edit-email" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Telefon raqam</label>
                            <input type="text" id="edit-phone" class="form-control" required>
                        </div>
                        <div id="worker-extra-fields" class="d-none border-top pt-3 mt-3">
                            <h6 class="fw-bold mb-3 text-primary">💼 Ustaga tegishli ma'lumotlar</h6>
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Tajriba (Yil)</label>
                                <input type="number" id="edit-experience" class="form-control">
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Manzil</label>
                                <input type="text" id="edit-location" class="form-control">
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Men haqimda (Bio)</label>
                                <textarea id="edit-bio" class="form-control" rows="3"></textarea>
                            </div>
                        </div>
                        <button type="submit" id="save-profile-btn" class="btn btn-primary w-100 mt-2">O'zgarishlarni saqlash</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="config/endpoints.js"></script>
    <script>
        let detailModal, workerProfileModal, myProfileModal;
        let currentUrl = API.services; 
        let servicesDataStore = {}; 

        function escapeHTML(str) {
            if (!str) return '';
            return str.toString().replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        document.addEventListener("DOMContentLoaded", async () => {
            detailModal = new bootstrap.Modal(document.getElementById('detailModal'));
            workerProfileModal = new bootstrap.Modal(document.getElementById('workerProfileModal'));
            myProfileModal = new bootstrap.Modal(document.getElementById('myProfileModal'));
            
            document.getElementById("profile-edit-form").addEventListener("submit", handleProfileUpdate);
            
            await initApp();
        });

        async function fetchWithAuth(url, options = {}) {
            const token = localStorage.getItem("access");
            const headers = { 
                "Content-Type": "application/json", 
                ...options.headers 
            };
            if (token) { 
                headers["Authorization"] = `Bearer ${token}`; 
            }
            return fetch(url, { ...options, headers });
        }

        async function initApp() {
            const token = localStorage.getItem("access");
            if (token) {
                await checkUserStatus();
            }
            renderNavbar();
            await loadCategories();
            await fetchServices(currentUrl); 
        }

        async function checkUserStatus() {
            try {
                const res = await fetchWithAuth(API.auth.me); 
                if (res.ok) {
                    const data = await res.json();
                    let isStaffValue = (data.is_staff === true || data.is_staff === "true" || data.is_staff === 1) ? "true" : "false";
                    let roleValue = data.role ? String(data.role).toLowerCase().trim() : "client";
                    
                    if (roleValue === "admin" || roleValue === "superuser") {
                        isStaffValue = "true";
                    }

                    localStorage.setItem("is_staff", isStaffValue);
                    localStorage.setItem("user_role", roleValue);
                }
            } catch(e) { 
                console.error("Foydalanuvchi statusini tekshirishda xato:", e); 
            }
        }

        function renderNavbar() {
            const nav = document.getElementById("nav-auth-links");
            const token = localStorage.getItem("access");
            const currentRole = localStorage.getItem("user_role") || "client";
            const currentStaff = localStorage.getItem("is_staff") || "false";

            if (token) {
                let dashboardLink = "dashboard.html"; 
                let btnText = "Kabinet (Mijoz)";
                let btnClass = "btn-outline-light";

                if (currentRole === "worker") {
                    btnText = "Kabinet (Usta)";
                    btnClass = "btn-outline-info";
                    dashboardLink = "dashboard.html";
                }

                if (currentStaff === "true" || currentRole === "admin") {
                    dashboardLink = "admin-dashboard.html"; 
                    btnText = "⚙️ Admin Panel";
                    btnClass = "btn-warning text-dark";
                }

                nav.innerHTML = `
                    <div class="nav-item d-inline-block"><button class="btn btn-sm btn-outline-info me-2 text-white" onclick="openMyProfileModal()">👤 Profilim</button></div>
                    <div class="nav-item d-inline-block"><a class="nav-link btn btn-sm ${btnClass} me-2 d-inline-block" href="${dashboardLink}">${btnText}</a></div>
                    <div class="nav-item d-inline-block"><button class="btn btn-sm btn-danger ms-2" onclick="logout()">Chiqish</button></div>
                `;
            } else {
                nav.innerHTML = `
                    <div class="nav-item d-inline-block"><a class="nav-link text-white d-inline-block" href="login.html">Kirish</a></div>
                    <div class="nav-item d-inline-block"><a class="btn btn-warning btn-sm ms-2 fw-bold text-dark" href="register.html">Ro'yxatdan o'tish</a></div>
                `;
            }
        }

        async function loadCategories() {
            try {
                const res = await fetch(API.categories);
                const data = await res.json();
                const select = document.getElementById("category-filter");
                const list = data.results || data || [];
                select.innerHTML = '<option value="">Barcha kategoriyalar</option>';
                list.forEach(c => { select.innerHTML += `<option value="${c.id}">${escapeHTML(c.name)}</option>`; });
            } catch (err) { console.error("Kategoriyalar yuklanmadi:", err); }
        }

        async function fetchServices(url) {
            try {
                const container = document.getElementById("services-container");
                container.innerHTML = "<div class='text-center text-muted py-5'>Xizmatlar yuklanmoqda...</div>";

                const res = await fetch(url);
                const data = await res.json();
                const services = data.results || data || []; 
                
                servicesDataStore = {};
                services.forEach(s => { servicesDataStore[s.id] = s; });

                displayServices(services);
                renderPagination(data.previous, data.next, url);
            } catch (err) {
                document.getElementById("services-container").innerHTML = `<div class="col-12 text-center text-danger py-5"><h5>Xizmatlarni yuklab bo'lmadi.</h5></div>`;
            }
        }

        function displayServices(services) {
            const container = document.getElementById("services-container");
            container.innerHTML = services.length ? "" : "<p class='text-center text-muted py-5'>Xizmat topilmadi.</p>";
            
            const currentRole = localStorage.getItem("user_role") || "client";
            const currentStaff = localStorage.getItem("is_staff") || "false";

            services.forEach(s => {
                let actionButton = "";
                if (currentStaff === "true") {
                    actionButton = `<button class="btn btn-sm btn-dark" disabled>Admin Rejimi</button>`;
                } else if (currentRole === "worker") {
                    actionButton = `<button class="btn btn-sm btn-secondary" disabled>Ustalarga taqiqlangan</button>`;
                } else {
                    actionButton = `<button class="btn btn-sm btn-primary fw-bold" onclick="bookOrder(${s.id})">Buyurtma berish</button>`;
                }

                const avgRating = parseFloat(s.average_rating) || 0;
                const reviewsCount = parseInt(s.reviews_count) || 0;
                let ratingHTML = reviewsCount > 0 
                    ? `<div class="mb-2 small d-flex align-items-center"><span class="text-warning me-1">${"★".repeat(Math.round(avgRating))}</span><span class="text-muted fw-bold">${avgRating.toFixed(1)}</span></div>`
                    : `<div class="mb-2 small text-muted">☆☆☆☆☆ (Sharhlar yo'q)</div>`;

                const workerId = s.worker || s.worker_id || (s.worker_profile ? s.worker_profile.id : 0);

                container.innerHTML += `
                    <div class="col-md-4 mb-4">
                        <div class="card h-100 shadow-sm border-0 d-flex flex-column justify-content-between">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-start mb-1">
                                    <h5 class="card-title fw-bold text-primary mb-0">${escapeHTML(s.name)}</h5>
                                    <a href="javascript:void(0)" onclick="viewWorkerProfile(${workerId})" class="text-primary fw-bold text-decoration-none small">
                                        👤 @${escapeHTML(s.worker_name || "Usta")}
                                    </a>
                                </div>
                                ${ratingHTML}
                                <p class="text-secondary small mb-3">${escapeHTML(s.description || '')}</p>
                                <button class="btn btn-link p-0 text-decoration-none small fw-bold" onclick="openDetailModal(${s.id})">Batafsil ko'rish →</button>
                            </div>
                            <div class="card-footer bg-transparent border-0 d-flex justify-content-between align-items-center pt-0 pb-3 px-3">
                                <span class="badge bg-success fs-6">${parseFloat(s.price).toLocaleString()} so'm</span>
                                ${actionButton}
                            </div>
                        </div>
                    </div>`;
            });
        }

        async function openDetailModal(serviceId) {
            const service = servicesDataStore[serviceId];
            if (!service) return;

            document.getElementById("detail-title").innerText = service.name;
            document.getElementById("detail-desc").innerText = service.description || 'Tavsif berilmagan';
            document.getElementById("detail-price").innerText = parseFloat(service.price).toLocaleString() + " so'm";

            const footer = document.getElementById("detail-footer");
            const currentRole = localStorage.getItem("user_role") || "client";
            const currentStaff = localStorage.getItem("is_staff") || "false";
            
            if (currentStaff === "true") {
                footer.innerHTML = `<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Yopish</button><button class="btn btn-dark" disabled>Admin Rejimi</button>`;
            } else if (currentRole === "worker") {
                footer.innerHTML = `<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Yopish</button><button class="btn btn-secondary" disabled>Ustalarga taqiqlangan</button>`;
            } else {
                footer.innerHTML = `<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Yopish</button><button class="btn btn-success fw-bold" onclick="bookOrder(${serviceId})">Hozir Buyurtma berish</button>`;
            }

            detailModal.show();
        }

        async function viewWorkerProfile(workerUserId) {
            if(!workerUserId || workerUserId === 0) {
                alert("Usta ID profili mavjud emas yoki topilmadi.");
                return;
            }
            const content = document.getElementById("worker-profile-content");
            content.innerHTML = `<div class='text-center py-3'><div class='spinner-border text-primary' role='status'></div></div>`;
            workerProfileModal.show();

            try {
                const res = await fetch(`${API.worker_public}${workerUserId}/`); 
                if (res.ok) {
                    const profile = await res.json();
                    content.innerHTML = `
                        <h4 class="fw-bold mb-1">@${escapeHTML(profile.username || profile.user || "usta")}</h4>
                        <p class="text-muted mb-3">📞 Telefon: ${escapeHTML(profile.phone_number || "Yashirilgan")}</p>
                        <div class="text-start bg-light p-3 rounded mb-3 small">
                            <p class="mb-2"><strong>💼 Tajriba:</strong> ${profile.experience_years || 0} yil</p>
                            <p class="mb-2"><strong>📍 Manzil:</strong> ${escapeHTML(profile.location || "Kiritilmagan")}</p>
                            <p class="mb-0"><strong>📝 Bio:</strong> ${escapeHTML(profile.bio || "Ma'lumot mavjud emas.")}</p>
                        </div>`;
                } else {
                    content.innerHTML = `<p class="text-danger py-3">Usta haqida ommaviy ma'lumot topilmadi.</p>`;
                }
            } catch (err) { content.innerHTML = `<p class="text-danger py-3">Yuklashda kutilmagan xatolik yuz berdi.</p>`; }
        }

        async function openMyProfileModal() {
            myProfileModal.show();
            const currentRole = localStorage.getItem("user_role") || "client";

            try {
                const resMe = await fetchWithAuth(API.auth.me, { method: "GET" });

                if (resMe.ok) {
                    const userData = await resMe.json();
                    document.getElementById("edit-username").value = userData.username || "";
                    document.getElementById("edit-email").value = userData.email || ""; // 📨 Email qiymatini inputga yuklash
                    document.getElementById("edit-phone").value = userData.phone_number || "";
                }

                const extraFields = document.getElementById("worker-extra-fields");

                if (currentRole === "worker") {
                    extraFields.classList.remove("d-none");
                    const resWorker = await fetchWithAuth(API.profile, { method: "GET" });

                    if (resWorker.ok) {
                        const workerData = await resWorker.json();
                        document.getElementById("edit-experience").value = workerData.experience_years || 0;
                        document.getElementById("edit-location").value = workerData.location || "";
                        document.getElementById("edit-bio").value = workerData.bio || "";
                    }
                } else {
                    extraFields.classList.add("d-none");
                }

            } catch (err) {
                console.error("Profil yuklanmadi:", err);
            }
        }

        async function handleProfileUpdate(event) {
            if (event) event.preventDefault();

            const saveBtn = document.getElementById("save-profile-btn");
            saveBtn.disabled = true;
            saveBtn.innerText = "Saqlanmoqda...";

            const username = document.getElementById("edit-username").value;
            const email = document.getElementById("edit-email").value; // 📨 Email qiymatini formadan olish
            const phone_number = document.getElementById("edit-phone").value;
            const currentRole = localStorage.getItem("user_role") || "client";

            try {
                // User update (PUT so'rovida endi email ham yuboriladi)
                const resMe = await fetchWithAuth(API.auth.me, {
                    method: "PUT",
                    body: JSON.stringify({
                        username,
                        email, // backend qabul qilishi uchun ulandi
                        phone_number
                    })
                });

                if (!resMe.ok) {
                    throw new Error("Asosiy profilni saqlab bo'lmadi");
                }

                // Worker profile update
                if (currentRole === "worker") {
                    const experience_years = parseInt(document.getElementById("edit-experience").value) || 0;
                    const location = document.getElementById("edit-location").value;
                    const bio = document.getElementById("edit-bio").value;

                    const resWorker = await fetchWithAuth(API.profile, {
                        method: "PATCH",
                        body: JSON.stringify({
                            experience_years,
                            location,
                            bio
                        })
                    });

                    if (!resWorker.ok) {
                        const errData = await resWorker.json().catch(() => ({}));
                        console.error(errData);
                        throw new Error(`Usta profilini saqlab bo'lmadi. Status: ${resWorker.status}`);
                    }
                }

                alert("Profil muvaffaqiyatli yangilandi! 🎉");
                myProfileModal.hide();
                await initApp();

            } catch (err) {
                console.error(err);
                alert(err.message);
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerText = "O'zgarishlarni saqlash";
            }
        }

        function applyFilters() {
            const searchQuery = document.getElementById("search-input").value;
            const categoryId = document.getElementById("category-filter").value;
            const minPrice = document.getElementById("min-price").value;
            const maxPrice = document.getElementById("max-price").value;

            currentUrl = `${API.services}?search=${encodeURIComponent(searchQuery)}&category=${categoryId}&min_price=${minPrice}&max_price=${maxPrice}`;
            fetchServices(currentUrl);
        }

        function renderPagination(prevUrl, nextUrl, current) {
            const paginationContainer = document.getElementById("pagination-container");
            paginationContainer.innerHTML = "";
            if (!prevUrl && !nextUrl) return;
            paginationContainer.innerHTML += `<li class="page-item ${prevUrl ? "" : "disabled"}"><button class="page-link" onclick="fetchServices('${prevUrl}')">« Orqaga</button></li>`;
            paginationContainer.innerHTML += `<li class="page-item ${nextUrl ? "" : "disabled"}"><button class="page-link" onclick="fetchServices('${nextUrl}')">Oldinga »</button></li>`;
        }

        function bookOrder(serviceId) {
            if (!localStorage.getItem("access")) {
                window.location.href = "login.html";
                return;
            }
            localStorage.setItem("selected_service_id", serviceId);
            window.location.href = "order.html";
        }

        function logout() { 
            localStorage.clear(); 
            window.location.href = "login.html"; 
        }
    </script>
</body>
</html>
