<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin boshqaruv paneli</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; }
        .admin-sidebar { background: #2c3e50; min-height: 100vh; color: #fff; }
        .stat-card { border: none; border-radius: 12px; transition: transform 0.2s; }
        .stat-card:hover { transform: translateY(-5px); }
    </style>
</head>
<body>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 col-lg-2 admin-sidebar p-3 d-flex flex-column justify-content-between">
                <div>
                    <h4 class="fw-bold text-center border-bottom pb-3 mb-4">UstaMarket Admin</h4>
                    <ul class="nav flex-column gap-2">
                        <li class="nav-item">
                            <a class="nav-link text-white bg-primary rounded px-3 py-2 fw-semibold" href="#">📊 Boshqaruv paneli</a>
                        </li>
                    </ul>
                </div>
                <div>
                    <div class="text-muted small mb-2" id="admin-name">@admin</div>
                    <button class="btn btn-danger btn-sm w-100 fw-bold" onclick="logout()">Xavfsiz Chiqish</button>
                </div>
            </div>

            <div class="col-md-9 col-lg-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="fw-bold text-dark m-0">Tizim Statistikasi & Boshqaruv</h2>
                    <span class="badge bg-danger fs-6 px-3 py-2">Admin Rejimi</span>
                </div>

                <div class="row mb-4">
                    <div class="col-md-4">
                        <div class="card stat-card bg-white text-dark shadow-sm p-3">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <h6 class="text-muted uppercase fw-bold small">Jami Buyurtmalar</h6>
                                    <h2 class="fw-bold m-0" id="stat-total-orders">0</h2>
                                </div>
                                <div class="fs-1 text-primary">📦</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card stat-card bg-white text-dark shadow-sm p-3">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <h6 class="text-muted uppercase fw-bold small">Kutilayotganlar</h6>
                                    <h2 class="fw-bold m-0 text-warning" id="stat-pending-orders">0</h2>
                                </div>
                                <div class="fs-1">⏳</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card stat-card bg-white text-dark shadow-sm p-3">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <h6 class="text-muted uppercase fw-bold small">Muvaffaqiyatli</h6>
                                    <h2 class="fw-bold m-0 text-success" id="stat-success-orders">0</h2>
                                </div>
                                <div class="fs-1">✅</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                        <h5 class="m-0 fw-bold text-secondary">Tizimdagi barcha arizalar</h5>
                        <button class="btn btn-sm btn-outline-secondary" onclick="loadAdminOrders()">Yangilash 🔄</button>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle m-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>ID</th>
                                        <th>Mijoz</th>
                                        <th>Xizmat nomi</th>
                                        <th>Holat</th>
                                        <th>Amal (Admin nazorati)</th>
                                    </tr>
                                </thead>
                                <tbody id="admin-orders-tbody">
                                    <tr><td colspan="5" class="text-center text-muted py-4">Yuklanmoqda...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="config/endpoints.js"></script>
    <script>
        const isStaff = localStorage.getItem("is_staff");

        document.addEventListener("DOMContentLoaded", async () => {
            // XAVFSIZLIK AUDITI: Agar kirgan odam admin bo'lmasa, uni haydash!
            if (!localStorage.getItem("access") || isStaff !== "true") {
                alert("Sizda ushbu sahifaga kirish huquqi yo'q!");
                window.location.href = "login.html";
                return;
            }

            if (localStorage.getItem("username")) {
                document.getElementById("admin-name").innerText = `@${localStorage.getItem("username")} (Admin)`;
            }

            await loadAdminOrders();
        });

        async function loadAdminOrders() {
            try {
                const res = await fetch(API.orders, {
                    headers: {
                        "Authorization": `Bearer ${localStorage.getItem("access")}`,
                        "Content-Type": "application/json"
                    }
                });
                if (!res.ok) throw new Error();
                const data = await res.json();
                const orders = data.results || data || [];

                // Statisika hisoblash
                document.getElementById("stat-total-orders").innerText = orders.length;
                document.getElementById("stat-pending-orders").innerText = orders.filter(o => o.status.toLowerCase() === 'pending').length;
                document.getElementById("stat-success-orders").innerText = orders.filter(o => o.status.toLowerCase() === 'completed').length;

                const tbody = document.getElementById("admin-orders-tbody");
                tbody.innerHTML = orders.length ? "" : `<tr><td colspan="5" class="text-center py-4 text-muted">Tizimda buyurtmalar mavjud emas.</td></tr>`;

                orders.forEach(order => {
                    tbody.innerHTML += `
                        <tr>
                            <td class="fw-bold">#${order.id}</td>
                            <td>${order.client || 'Noma\'lum'}</td>
                            <td>${order.service_name || 'Noma\'lum'}</td>
                            <td><span class="badge bg-dark text-capitalize">${order.status}</span></td>
                            <td>
                                <button class="btn btn-xs btn-danger fw-bold py-1 px-2" style="font-size: 0.8rem;" onclick="adminDeleteOrder(${order.id})">O'chirish</button>
                            </td>
                        </tr>`;
                });

            } catch (err) { console.error(err); }
        }

        async function adminDeleteOrder(id) {
            if(!confirm("Ushbu buyurtmani tizimdan butunlay o'chirmoqchimisiz?")) return;
            try {
                const res = await fetch(`${API.orders}${id}/`, {
                    method: "DELETE",
                    headers: { "Authorization": `Bearer ${localStorage.getItem("access")}` }
                });
                if (res.ok) { alert("Buyurtma o'chirildi!"); await loadAdminOrders(); }
            } catch (err) { console.error(err); }
        }

        function logout() {
            localStorage.clear();
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
