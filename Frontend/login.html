<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Tizimga kirish - UstaMarketplace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">

    <div class="card p-4 shadow-sm border-0" style="width: 100%; max-width: 400px;">
        <h3 class="text-center fw-bold mb-2">Tizimga kirish</h3>
        <p class="text-center text-muted small mb-4">UstaMarketplace Demo loyihasi</p>
        
        <div id="error-alert" class="alert alert-danger d-none small py-2 text-center" role="alert"></div>

        <form id="login-form">
            <div class="mb-3">
                <label class="form-label small fw-bold">Username</label>
                <input type="text" id="username" class="form-control" required placeholder="Foydalanuvchi nomi">
            </div>
            <div class="mb-3">
                <label class="form-label small fw-bold">Parol</label>
                <input type="password" id="password" class="form-control" required placeholder="••••••••">
            </div>
            <button type="submit" id="submit-btn" class="btn btn-primary w-100 py-2 fw-bold">Kirish</button>
        </form>
        
        <p class="text-center mt-3 mb-0 small">Akkount yo'qmi? <a href="register.html" class="fw-bold">Ro'yxatdan o'tish</a></p>
        <p class="text-center mt-2 mb-0"><a href="index.html" class="text-secondary small">← Bosh sahifaga qaytish</a></p>
    </div>

    <script src="config/endpoints.js"></script>
    <script>
        // Sahifa yuklanganda tekshirish
        document.addEventListener("DOMContentLoaded", () => {
            const token = localStorage.getItem("access");
            const role = localStorage.getItem("user_role");

            if (token && role) {
                redirectByRole(role);
            }
        });

        // Login form yuborilganda
        document.getElementById("login-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;
            const errorAlert = document.getElementById("error-alert");
            const submitBtn = document.getElementById("submit-btn");

            errorAlert.classList.add("d-none");
            submitBtn.disabled = true;
            submitBtn.innerText = "Kirilmoqda...";

            try {
                const res = await fetch(API.auth.login, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();
                console.log("Backenddan kelgan ma'lumot:", data);

                if (res.ok) {
                    // 1. Token va foydalanuvchi nomini saqlash
                    localStorage.setItem("access", data.access || data.token); 
                    localStorage.setItem("username", data.username || username);
                    
                    // 2. Foydalanuvchi ID sini saqlash
                    const userId = data.user_id || data.id || (data.user ? data.user.id : null);
                    if (userId) {
                        localStorage.setItem("user_id", userId);
                    }

                    // 3. Rolni tekshirish (Kengaytirilgan variant)
                    let userRole = "client"; 

                    if (data.user) {
                        if (data.user.is_superuser === true || data.user.is_staff === true || data.user.role === "admin") {
                            userRole = "admin";
                        } else if (data.user.role === "worker" || data.user.role === "usta") {
                            userRole = "worker";
                        } else if (data.user.role) {
                            userRole = data.user.role;
                        }
                    } else if (data.is_superuser === true || data.is_staff === true || data.role === "admin") {
                        userRole = "admin";
                    } else if (data.role === "worker" || data.role === "usta") {
                        userRole = "worker";
                    } else if (data.role) {
                        userRole = data.role;
                    }

                    const finalRole = String(userRole).toLowerCase().trim();
                    localStorage.setItem("user_role", finalRole);

                    // 4. Yo'naltirish
                    redirectByRole(finalRole);

                } else {
                    const errorMsg = data.detail || data.non_field_errors || "Username yoki parol noto'g'ri!";
                    errorAlert.innerText = typeof errorMsg === 'object' ? JSON.stringify(errorMsg) : errorMsg;
                    errorAlert.classList.remove("d-none");
                }
            } catch(e) {
                console.error("Xatolik:", e);
                errorAlert.innerText = "Server bilan aloqa uzildi!";
                errorAlert.classList.remove("d-none");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Kirish";
            }
        });

        function redirectByRole(role) {
            if (role === "admin" || role === "superuser" || role === "staff") {
                window.location.href = "dashboard-admin.html"; 
            } else if (role === "worker" || role === "usta") {
                window.location.href = "dashboard-worker.html"; 
            } else {
                window.location.href = "dashboard.html"; 
            }
        }
    </script>
</body>
</html>
