<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Tizimga kirish - UstaMarketplace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">

    <div class="card p-4 shadow-sm border-0" style="width: 100%; max-width: 400px;">
        <h3 class="text-center fw-bold mb-2">Tizimga kirish</h3>
        <p class="text-center text-muted small mb-4">UstaMarketplace Demo loyihasi</p>
        
        <div id="error-alert" class="alert alert-danger d-none small py-2 text-center" role="alert"></div>

        <form id="login-form">
            <div class="mb-3">
                <label class="form-label small fw-bold">Username</label>
                <input type="text" id="username" class="form-control" required placeholder="Foydalanuvchi nomi">
            </div>
            <div class="mb-3">
                <label class="form-label small fw-bold">Parol</label>
                <input type="password" id="password" class="form-control" required placeholder="••••••••">
            </div>
            <button type="submit" id="submit-btn" class="btn btn-primary w-100 py-2 fw-bold">Kirish</button>
        </form>
        
        <p class="text-center mt-3 mb-0 small">Akkount yo'qmi? <a href="register.html" class="fw-bold">Ro'yxatdan o'tish</a></p>
        <p class="text-center mt-2 mb-0"><a href="index.html" class="text-secondary small">← Bosh sahifaga qaytish</a></p>
    </div>

<script src="config/endpoints.js"></script>
<script>
        document.addEventListener("DOMContentLoaded", () => {
            const token = localStorage.getItem("access");
            const isStaff = localStorage.getItem("is_staff");

            if (token) {
                if (isStaff === "true") {
                    window.location.href = "admin-dashboard.html";
                } else {
                    window.location.href = "index.html";
                }
            }
        });

        function parseJwt(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');

                const jsonPayload = decodeURIComponent(
                    window.atob(base64)
                        .split('')
                        .map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2))
                        .join('')
                );

                return JSON.parse(jsonPayload);
            } catch {
                return null;
            }
        }

        function executeRouting(isStaff) {
            if (isStaff === true || isStaff === "true") {
                window.location.href = "admin-dashboard.html";
            } else {
                window.location.href = "index.html";
            }
        }

        document.getElementById("login-form").addEventListener("submit", async (e) => {
            e.preventDefault();

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;

            const errorAlert = document.getElementById("error-alert");
            const submitBtn = document.getElementById("submit-btn");

            errorAlert.classList.add("d-none");
            submitBtn.disabled = true;
            submitBtn.innerText = "Kirilmoqda...";

            try {
                // Login
                const loginRes = await fetch(API.auth.login, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        username,
                        password
                    })
                });

                const loginData = await loginRes.json();

                if (!loginRes.ok) {
                    throw new Error(
                        loginData.detail ||
                        "Username yoki parol noto'g'ri!"
                    );
                }

                // Tokenlar
                localStorage.setItem("access", loginData.access);
                localStorage.setItem("refresh", loginData.refresh);
                localStorage.setItem("username", username);

                const payload = parseJwt(loginData.access);

                if (payload) {
                    localStorage.setItem(
                        "user_id",
                        payload.user_id || payload.id || ""
                    );
                }

                // Me endpoint
                const meRes = await fetch(API.auth.me, {
                    headers: {
                        Authorization: `Bearer ${loginData.access}`
                    }
                });

                const user = await meRes.json();

                if (!meRes.ok) {
                    throw new Error(
                        "Foydalanuvchi ma'lumotlarini olishda xatolik."
                    );
                }

                localStorage.setItem("user_role", user.role);
                localStorage.setItem("is_staff", user.is_staff);

                executeRouting(user.is_staff);

            } catch (error) {
                errorAlert.innerText = error.message;
                errorAlert.classList.remove("d-none");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Kirish";
            }
        });
</script>
</body>
</html>
