<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tizimga Kirish</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <div class="card shadow border-0" style="width: 100%; max-width: 400px; margin-top: 100px;">
        <div class="card-body p-4">
            <h3 class="text-center fw-bold text-dark mb-4">Tizimga Kirish</h3>
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="mb-3">
                    <label class="form-label">Foydalanuvchi nomi (Username)</label>
                    <input type="text" id="username" class="form-control" required placeholder="admin yoki usta...">
                </div>
                <div class="mb-4">
                    <label class="form-label">Parol</label>
                    <input type="password" id="password" class="form-control" required placeholder="******">
                </div>
                <button type="submit" class="btn btn-dark w-100 fw-bold py-2">Kirish</button>
            </form>
        </div>
    </div>

    <script src="config/endpoints.js"></script>
    <script>
        async function handleLogin(event) {
            event.preventDefault();
            const usernameInput = document.getElementById("username").value;
            const passwordInput = document.getElementById("password").value;

            try {
                // DIQQAT: API.login endpointingiz config/endpoints.js ichida bo'lishi kerak
                const res = await fetch(API.login || "/api/token/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username: usernameInput, password: passwordInput })
                });

                if (!res.ok) {
                    alert("Username yoki parol xato!");
                    return;
                }

                const data = await res.json();
                
                // Backenddan keladigan ma'lumotlarni aniq saqlaymiz
                localStorage.setItem("access", data.access || data.token);
                localStorage.setItem("user_id", data.user_id || data.id);
                localStorage.setItem("username", data.username);
                
                // Rol va Staff ma'lumotlarini tozalab saqlash
                const role = data.role ? String(data.role).toLowerCase().trim() : "client";
                const isStaff = String(data.is_staff).toLowerCase().trim(); // "true" yoki "false"
                
                localStorage.setItem("user_role", role);
                localStorage.setItem("is_staff", isStaff);

                // 🚀 TO'G'RI SAHIFAGA YO'NALTIRISH (REDIRECT)
                if (isStaff === "true") {
                    window.location.href = "dashboard-admin.html";
                } else {
                    window.location.href = "dashboard.html";
                }

            } catch (err) {
                console.error(err);
                alert("Tizimga kirishda xatolik yuz berdi!");
            }
        }
    </script>
</body>
</html>
