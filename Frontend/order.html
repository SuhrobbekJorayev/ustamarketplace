<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8"><title>Buyurtma berish</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">
    <div class="container" style="max-width: 400px;">
        <div class="card p-4 shadow border-0 text-center">
            <h4 class="fw-bold mb-4">Buyurtmani tasdiqlaysizmi?</h4>
            <p class="text-muted">Tugmani bossangiz, usta bilan bog'lanish uchun buyurtma yaratiladi.</p>
            <button id="confirm-btn" class="btn btn-success w-100 py-2">Ha, buyurtma beraman</button>
            <a href="index.html" class="btn btn-link w-100 mt-2 text-muted text-decoration-none">Bekor qilish</a>
        </div>
    </div>
    <script src="config/endpoints.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Upwork mantiqi: Worker rolidagilar buyurtma bera olmaydi!
            const role = localStorage.getItem("user_role");
            if (role === "worker") {
                alert("Freelancerlar/Ustalar buyurtma bera olmaydi! Siz faqat buyurtma olishingiz mumkin.");
                window.location.href = "dashboard.html";
            }
        });

        document.getElementById("confirm-btn").addEventListener("click", async () => {
            const serviceId = localStorage.getItem("selected_service_id");
            const clientId = localStorage.getItem("user_id");
            
            const headers = await getAuthHeaders();
            const res = await fetch(API.orders, {
                method: "POST",
                headers: headers,
                body: JSON.stringify({ 
                    service: parseInt(serviceId),
                    client: parseInt(clientId)
                })
            });
            
            if (res.ok) {
                alert("Buyurtma yaratildi! Status: Pending");
                localStorage.removeItem("selected_service_id");
                window.location.href = "dashboard.html";
            } else { 
                alert("Xatolik: Buyurtma qabul qilinmadi."); 
            }
        });
    </script>
</body>
</html>
