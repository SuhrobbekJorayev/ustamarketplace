<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buyurtmani rasmiylashtirish</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card p-4 shadow-sm border-0">
                    <h3 class="fw-bold text-center mb-4 text-primary">Buyurtmani tasdiqlash</h3>

                    <div id="service-summary" class="p-3 bg-light rounded mb-4">
                        <h5>Yuklanmoqda...</h5>
                    </div>

                    <div class="d-flex gap-2">
                        <a href="index.html" class="btn btn-secondary w-50">Bekor qilish</a>
                        <button class="btn btn-success w-50 fw-bold" onclick="submitOrder()">Tasdiqlash</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="config/endpoints.js"></script>
    <script>
        const serviceId = localStorage.getItem("selected_service_id");
        const token = localStorage.getItem("access");

        // Sahifa yuklanganda xizmat ma'lumotlarini olish
        document.addEventListener("DOMContentLoaded", async () => {
            if (!token) {
                alert("Buyurtma berish uchun avval tizimga kiring!");
                window.location.href = "login.html";
                return;
            }

            if (!serviceId) {
                alert("Xizmat tanlanmagan!");
                window.location.href = "index.html";
                return;
            }

            if (typeof API === "undefined" || !API.services || !API.orders) {
                alert("API endpointlar topilmadi. endpoints.js faylini tekshiring.");
                return;
            }

            try {
                const res = await fetch(`${API.services}${serviceId}/`);

                if (!res.ok) {
                    document.getElementById("service-summary").innerHTML = `
                        <p class="text-danger mb-0">Xizmat ma'lumotlarini yuklab bo'lmadi (Status: ${res.status}).</p>
                    `;
                    return;
                }

                const service = await res.json();

                document.getElementById("service-summary").innerHTML = `
                    <h5 class="fw-bold text-dark">${service.name}</h5>
                    <p class="text-muted small mb-2">${service.description || "Tavsif berilmagan"}</p>
                    <div class="d-flex justify-content-between align-items-center">
                        <span>Usta: <b>@${service.worker_name || "Noma'lum"}</b></span>
                        <span class="badge bg-success fs-6">
                            ${service.price ? parseFloat(service.price).toLocaleString() : "0"} so'm
                        </span>
                    </div>
                `;
            } catch (error) {
                console.error("Service fetch error:", error);
                document.getElementById("service-summary").innerHTML = `
                    <p class="text-danger mb-0">Tarmoq xatosi sabab xizmat yuklanmadi.</p>
                `;
            }
        });

        // Buyurtma berish funksiyasi
        async function submitOrder() {
            if (!token) {
                alert("Buyurtma berish uchun avval tizimga kiring!");
                window.location.href = "login.html";
                return;
            }

            if (!serviceId) {
                alert("Xizmat tanlanmagan!");
                return;
            }

            try {
                const res = await fetch(API.orders, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        service: Number(serviceId)
                    })
                });

                console.log("Server status:", res.status);

                // 1. Agar Server 500 (Internal Server Error) qaytargan bo'lsa
                if (res.status === 500) {
                    alert("Xatolik: Server ichki xatosi (500)! Backend-da Celery yoki boshqa muammo bor.");
                    return;
                }

                // Server javobini matn (text) ko'rinishida o'qiymiz (ichida HTML bo'lsa ham yiqilmaydi)
                const responseText = await res.text();
                let data = null;

                // Agar javob JSON formatida bo'lsa, uni parse qilamiz
                if (responseText) {
                    try {
                        data = JSON.parse(responseText);
                    } catch (e) {
                        console.warn("Server javobi JSON emas, HTML yoki boshqa formatda keldi.");
                    }
                }

                // 2. Agar buyurtma muvaffaqiyatli yaratilgan bo'lsa (200 yoki 201)
                if (res.status === 201 || res.status === 200) {
                    alert("Buyurtmangiz muvaffaqiyatli yaratildi! 🎉 Kabinet orqali kuzatishingiz mumkin.");
                    localStorage.removeItem("selected_service_id");
                    window.location.href = "dashboard.html";
                    return;
                }

                // 3. Agar boshqa biror xatolik statusi qaytgan bo'lsa (400, 401, 403 va h.k.)
                let errorMessage = `Xatolik yuz berdi (Status: ${res.status})`;
                if (data && data.detail) {
                    errorMessage = data.detail;
                } else if (data) {
                    errorMessage = JSON.stringify(data);
                }

                alert("Buyurtma berishda xatolik: " + errorMessage);

            } catch (error) {
                console.error("submitOrder error:", error);
                alert("Tarmoq xatosi yoki server o‘chiq (Ulanish rad etildi).");
            }
        }
    </script>
</body>
</html>
