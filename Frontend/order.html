<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Buyurtmani rasmiylashtirish</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card p-4 shadow-sm border-0">
                    <h3 class="fw-bold text-center mb-4 text-primary">Buyurtmani tasdiqlash</h3>

                    <div id="service-summary" class="p-3 bg-light rounded mb-4">
                        <h5>Yuklanmoqda...</h5>
                    </div>

                    <div class="d-flex gap-2">
                        <a href="index.html" class="btn btn-secondary w-50">Bekor qilish</a>
                        <button class="btn btn-success w-50 fw-bold" onclick="submitOrder()">Tasdiqlash</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="config/endpoints.js"></script>
    <script>
        const serviceId = localStorage.getItem("selected_service_id");
        const token = localStorage.getItem("access");

        document.addEventListener("DOMContentLoaded", async () => {
            if (!token) {
                alert("Buyurtma berish uchun avval tizimga kiring!");
                window.location.href = "login.html";
                return;
            }

            if (!serviceId) {
                alert("Xizmat tanlanmagan!");
                window.location.href = "index.html";
                return;
            }

            if (!API || !API.services || !API.orders) {
                alert("API endpointlar topilmadi. endpoints.js ni tekshiring.");
                return;
            }

            try {
                const res = await fetch(`${API.services}${serviceId}/`);

                if (!res.ok) {
                    document.getElementById("service-summary").innerHTML = `
                        <p class="text-danger mb-0">Xizmat ma'lumotlarini yuklab bo'lmadi.</p>
                    `;
                    return;
                }

                const service = await res.json();

                document.getElementById("service-summary").innerHTML = `
                    <h5 class="fw-bold text-dark">${service.name}</h5>
                    <p class="text-muted small mb-2">${service.description || "Tavsif berilmagan"}</p>
                    <div class="d-flex justify-content-between align-items-center">
                        <span>Usta: <b>@${service.worker_name || "Noma'lum"}</b></span>
                        <span class="badge bg-success fs-6">
                            ${service.price ? parseFloat(service.price).toLocaleString() : "0"} so'm
                        </span>
                    </div>
                `;
            } catch (error) {
                console.error("Service fetch error:", error);
                document.getElementById("service-summary").innerHTML = `
                    <p class="text-danger mb-0">Tarmoq xatosi sabab xizmat yuklanmadi.</p>
                `;
            }
        });

        async function submitOrder() {
            if (!token) {
                alert("Buyurtma berish uchun avval tizimga kiring!");
                window.location.href = "login.html";
                return;
            }

            if (!serviceId) {
                alert("Xizmat tanlanmagan!");
                return;
            }

            try {
                const res = await fetch(API.orders, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        service: Number(serviceId)
                    })
                });

                console.log("Order response status:", res.status);

                // response body bo‘sh bo‘lsa ham yiqilmasin
                let data = null;
                const text = await res.text();

                if (text) {
                    try {
                        data = JSON.parse(text);
                    } catch (e) {
                        console.warn("Response JSON emas:", text);
                    }
                }

                console.log("Order response data:", data);

                // Agar backend order yaratgan bo‘lsa — success
                if (res.status === 201 || res.status === 200) {
                    alert("Buyurtmangiz muvaffaqiyatli yaratildi! 🎉 Kabinet orqali kuzatishingiz mumkin.");
                    localStorage.removeItem("selected_service_id");
                    window.location.href = "dashboard.html";
                    return;
                }

                let errorMessage = "Buyurtma berishda xatolik yuz berdi.";

                if (data) {
                    if (data.detail) {
                        errorMessage = data.detail;
                    } else {
                        errorMessage = JSON.stringify(data);
                    }
                }

                alert("Buyurtma berishda xatolik: " + errorMessage);

            } catch (error) {
                console.error("submitOrder error:", error);
                alert("Tarmoq xatosi yoki server o‘chiq.");
            }
        }
    </script>
</body>
</html>
